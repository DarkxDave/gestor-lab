<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Muestras</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/" routerDirection="root">
        <ion-icon slot="start" name="home"></ion-icon>
        Inicio
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Mensaje de estado -->
  <ion-card *ngIf="message" class="ion-margin-bottom">
    <ion-card-content>
      <p>{{ message }}</p>
    </ion-card-content>
  </ion-card>

  <!-- Buscador -->
  <ion-card class="ion-margin-bottom">
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Buscar por ID o código</ion-label>
        <ion-input 
          type="text" 
          [(ngModel)]="searchTerm" 
          name="searchTerm"
          (ionChange)="searchSamples()">
        </ion-input>
        <ion-button 
          slot="end" 
          fill="clear" 
          *ngIf="searchTerm"
          (click)="clearSearch()">
          <ion-icon name="close"></ion-icon>
        </ion-button>
      </ion-item>
      <div class="search-buttons ion-margin-top">
        <ion-button expand="block" color="primary" (click)="searchSamples()" [disabled]="isLoading">
          <ion-icon name="search" slot="start"></ion-icon>
          Buscar
        </ion-button>
        <ion-button expand="block" color="secondary" (click)="loadSamples()" [disabled]="isLoading">
          <ion-icon name="refresh" slot="start"></ion-icon>
          Recargar
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Lista de muestras cargando -->
  <ion-card *ngIf="isLoading">
    <ion-card-content class="ion-text-center ion-padding">
      <ion-spinner></ion-spinner>
      <p>{{ message }}</p>
    </ion-card-content>
  </ion-card>

  <!-- Lista de muestras vacía -->
  <ion-card *ngIf="!isLoading && filteredSamples.length === 0">
    <ion-card-content class="ion-text-center ion-padding">
      <ion-icon name="document-outline" style="font-size: 48px; color: #ccc;"></ion-icon>
      <p class="ion-margin-top">No hay muestras para mostrar</p>
    </ion-card-content>
  </ion-card>

  <!-- Lista de muestras -->
  <div *ngIf="!isLoading && filteredSamples.length > 0">
    <ion-card *ngFor="let sample of filteredSamples" class="sample-card">
      <ion-card-content>
        <div class="sample-header">
          <div class="sample-id">
            <p class="sample-label">ALI:</p>
            <p class="sample-code">{{ sample.sample_id || sample.id }}</p>
          </div>
        </div>

        <!-- Botones de acceso a formularios -->
        <div class="button-group ion-margin-top">
          <ion-button 
            expand="block" 
            color="primary"
            [routerLink]="['/form-tpa']" 
            [queryParams]="{ sample_id: sample.sample_id }">
            <ion-icon name="document-outline" slot="start"></ion-icon>
            TPA
          </ion-button>
          
          <ion-button 
            expand="block" 
            color="secondary"
            [routerLink]="['/form-ram']" 
            [queryParams]="{ sample_id: sample.sample_id }">
            <ion-icon name="flask-outline" slot="start"></ion-icon>
            RAM
          </ion-button>

          <ion-button 
            expand="block" 
            color="tertiary"
            [routerLink]="['/form-rmyl']" 
            [queryParams]="{ sample_id: sample.sample_id }">
            <ion-icon name="beaker-outline" slot="start"></ion-icon>
            RM y L
          </ion-button>
        </div>

        <div class="button-group">
          <ion-button 
            expand="block" 
            color="success"
            [routerLink]="['/form-ctcfe']" 
            [queryParams]="{ sample_id: sample.sample_id }">
            <ion-icon name="bug-outline" slot="start"></ion-icon>
            CTCFE
          </ion-button>

          <ion-button 
            expand="block" 
            color="warning"
            [routerLink]="['/form-sal']" 
            [queryParams]="{ sample_id: sample.sample_id }">
            <ion-icon name="flask-outline" slot="start"></ion-icon>
            Sal
          </ion-button>

          <ion-button 
            expand="block" 
            color="danger"
            [routerLink]="['/form-entero']" 
            [queryParams]="{ sample_id: sample.sample_id }">
            <ion-icon name="medical-outline" slot="start"></ion-icon>
            Entero
          </ion-button>
        </div>

        <div class="button-group">
          <ion-button 
            expand="block" 
            color="medium"
            [routerLink]="['/form-saureus']" 
            [queryParams]="{ sample_id: sample.sample_id }">
            <ion-icon name="micro-outline" slot="start"></ion-icon>
            S.aureus
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
