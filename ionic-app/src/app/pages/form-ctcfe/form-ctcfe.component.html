<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Formulario CT, CF y E.coli</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/" routerDirection="root">
        <ion-icon slot="start" name="home"></ion-icon>
        Inicio
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="loadSampleData()" class="ion-padding-bottom">
    <ion-item>
      <ion-label position="floating">ALI</ion-label>
      <ion-input type="text" [(ngModel)]="sampleId" name="sample_id" required></ion-input>
    </ion-item>
    <ion-button type="submit" expand="block" class="ion-margin-top">Cargar</ion-button>
  </form>

  <app-form-tabs [sampleId]="sampleId"></app-form-tabs>

  <div *ngIf="message" class="alert alert-info">{{ message }}</div>

  <form (ngSubmit)="saveForm()">
    <ion-card>
      <ion-card-content>
        <ion-item>
          <ion-label position="floating">Notas</ion-label>
          <ion-textarea [(ngModel)]="formData.notes" name="notes"></ion-textarea>
        </ion-item>
      </ion-card-content>
    </ion-card>
    <ion-button type="submit" expand="block" class="ion-margin-top">Guardar CT/CF/E.coli</ion-button>
  </form>
  <div class="ion-padding-top small-text">Mínimo funcional; se ampliará con campos específicos.</div>
</ion-content>
